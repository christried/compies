name: CI

on:
  pull_request:
    branches: [staging, main]
  # Every pushed branch, not only staging and main: an implementer's branch has no PR, and its first full run used to
  # come after the merge into the integration branch, which went red four times in 0.7 (retro 0.7). A branch with a
  # PR runs twice per push (the push and the PR's merge commit); Actions minutes are free on a public repo.
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm test:build
      # The realtime Worker is its own install and has its own checks (#156).
      - run: pnpm --dir realtime install --frozen-lockfile
      - run: pnpm --dir realtime typecheck
      - run: pnpm --dir realtime test

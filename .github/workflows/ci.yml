name: CI

# One run per head: the push run. A PR starts no run of its own. Both protected branches require an up-to-date head
# (`strict`), so the head contains the base and the merge result's tree is the head's tree. The push run on the head
# already reports the required check `check`, so one run is enough.
# Every pushed branch runs, not only staging and main: an implementer's branch has no PR, and its first full run used
# to come after the merge into the integration branch, which went red four times in 0.7 (retro 0.7). Actions minutes
# are free on a public repo.
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The changelog check compares every released section with main's (#566). checkout leaves a shallow clone of the
      # pushed commit only, and on a feature branch no `origin/main` ref, so the test would skip itself.
      - name: Fetch main for the changelog check
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git log -1 --format='origin/main is at %h %s' origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm test:build
      # The realtime Worker is its own install and has its own checks (#156).
      - run: pnpm --dir realtime install --frozen-lockfile
      - run: pnpm --dir realtime typecheck
      - run: pnpm --dir realtime test

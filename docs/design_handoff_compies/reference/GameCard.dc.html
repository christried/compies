<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isCard }}" hint-placeholder-val="{{ true }}">
  <div style="position:relative;display:flex;flex-direction:column;width:100%;height:100%;box-sizing:border-box;border:{{ bd }};border-radius:14px;background:var(--cp-surface);box-shadow:{{ sh }};transform:{{ tf }};overflow:hidden;transition:transform 120ms cubic-bezier(.2,0,0,1),box-shadow 120ms cubic-bezier(.2,0,0,1)">
    <div style="position:relative;aspect-ratio:16/10;background:{{ acc }};border-bottom:2px solid var(--cp-line);display:flex;align-items:flex-end;justify-content:flex-start;padding:0 12px 6px;box-sizing:border-box;overflow:hidden">
      <span aria-hidden="true" style="font-family:var(--cp-font-display);font-size:38px;line-height:1;color:{{ ic }}">{{ ini }}</span>
      <sc-if value="{{ suggested }}"><span style="position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;border:2px solid var(--cp-line);background:var(--cp-surface);color:var(--cp-ink);font-size:12px;font-weight:700"><dc-import name="Icon" icon="sparkles" size="{{ 12 }}" hint-size="12px,12px"></dc-import>Passt</span></sc-if>
      <sc-if value="{{ inPool }}"><span style="position:absolute;right:8px;top:8px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--cp-line);background:var(--cp-on-primary);color:var(--cp-primary)"><dc-import name="Icon" icon="check" size="{{ 16 }}" sw="{{ 3 }}" hint-size="16px,16px"></dc-import></span></sc-if>
      <sc-if value="{{ hasStamp }}"><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:10px;border:3px solid var(--cp-line);background:{{ stBg }};color:{{ stFg }};font-family:var(--cp-font-display);font-size:20px;line-height:1.1;text-transform:uppercase;box-shadow:var(--cp-shadow-sm);white-space:nowrap"><sc-if value="{{ stTeam }}"><span style="margin-left:-8px;display:grid"><dc-import name="TeamMark" team="{{ team }}" size="{{ 24 }}" hint-size="24px,24px"></dc-import></span></sc-if>{{ stTxt }}</span></sc-if>
    </div>
    <div style="padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px">
      <b style="font-size:15px;line-height:1.25;color:{{ nc }};text-decoration:{{ td }};text-decoration-thickness:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ name }}</b>
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--cp-ink-2)"><span style="display:inline-flex;align-items:center;gap:4px"><dc-import name="Icon" icon="users" size="{{ 13 }}" hint-size="13px,13px"></dc-import>{{ players }}</span><span>{{ fmt }}</span></div>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isRow }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 10px 6px 6px;box-sizing:border-box;width:100%;border:{{ bd }};border-radius:12px;background:var(--cp-surface);box-shadow:{{ sh }};transform:{{ tf }}">
    <span aria-hidden="true" style="flex:none;width:46px;height:46px;border-radius:9px;box-sizing:border-box;border:2px solid var(--cp-line);background:{{ acc }};display:grid;place-items:center;font-family:var(--cp-font-display);font-size:19px;color:{{ ic }}">{{ ini }}</span>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <b style="color:{{ nc }};text-decoration:{{ td }};text-decoration-thickness:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ name }}</b>
      <div style="display:flex;gap:10px;font-size:12px;color:var(--cp-ink-2)"><span style="display:inline-flex;align-items:center;gap:4px"><dc-import name="Icon" icon="users" size="{{ 12 }}" hint-size="12px,12px"></dc-import>{{ players }}</span><span>{{ fmt }}</span></div>
    </div>
    <sc-if value="{{ suggested }}"><span style="flex:none;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;border:2px solid var(--cp-line);font-size:12px;font-weight:700"><dc-import name="Icon" icon="sparkles" size="{{ 12 }}" hint-size="12px,12px"></dc-import>Passt</span></sc-if>
    <sc-if value="{{ hasStamp }}"><span style="flex:none;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 4px;border-radius:8px;border:2px solid var(--cp-line);background:{{ stBg }};color:{{ stFg }};font-family:var(--cp-font-display);font-size:14px;text-transform:uppercase;white-space:nowrap"><sc-if value="{{ stTeam }}"><dc-import name="TeamMark" team="{{ team }}" size="{{ 20 }}" hint-size="20px,20px"></dc-import></sc-if>{{ stTxt }}</span></sc-if>
    <sc-if value="{{ inPool }}"><span style="flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--cp-line);background:var(--cp-on-primary);color:var(--cp-primary)"><dc-import name="Icon" icon="check" size="{{ 16 }}" sw="{{ 3 }}" hint-size="16px,16px"></dc-import></span></sc-if>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:230},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rocket League&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;players&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2–8&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fmt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Teams&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;banned&quot;,&quot;picked&quot;,&quot;vetoed&quot;,&quot;drawn&quot;,&quot;disabled&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;team&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;},&quot;order&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;card&quot;,&quot;row&quot;],&quot;default&quot;:&quot;card&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;suggested&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;inPool&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;cover&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;}}">
const ACC=['var(--cp-primary)','var(--cp-mint)','var(--cp-pop)','var(--cp-cobalt)'];
class Component extends DCLogic {
  renderVals(){
    const p=this.props, name=p.title||'Spiel', st=p.state||'default', team=+(p.team||1);
    let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0;
    const tok=name.split(/[\s\-:]+/).filter(Boolean), ini=(tok[0]||'?')[0]+((tok[1]||'')[0]||'');
    const dim=['banned','vetoed','drawn','disabled'].includes(st), sel=!!p.selected;
    const S={banned:['var(--cp-team-'+team+')','var(--cp-team-'+team+'-ink)','Gebannt',true],picked:['var(--cp-primary)','var(--cp-on-primary)','Pick '+(p.order||1),true],vetoed:['var(--cp-hot)','var(--cp-on-hot)','Veto',false],drawn:['var(--cp-surface)','var(--cp-ink)','Vom Rad',false]}[st];
    return {isCard:p.layout!=='row',isRow:p.layout==='row',name,ini:ini.toUpperCase(),players:p.players||'2–8',fmt:p.fmt||'Teams',team,
      acc:dim?'var(--cp-paper-2)':(p.cover!=null?ACC[p.cover%4]:ACC[h%4]),ic:dim?'var(--cp-ink-3)':'#151515',nc:dim?'var(--cp-ink-2)':'var(--cp-ink)',td:(st==='banned'||st==='vetoed')?'line-through':'none',
      bd:sel?'3px solid var(--cp-focus)':dim?'var(--cp-bw) dashed var(--cp-ink-3)':'var(--cp-bw) solid var(--cp-line)',sh:sel?'var(--cp-shadow-card)':dim?'none':'var(--cp-shadow-sm)',tf:sel?'translate(-2px,-2px)':'none',
      suggested:!!p.suggested&&!dim,inPool:!!p.inPool&&!dim,hasStamp:!!S,stBg:S?S[0]:'',stFg:S?S[1]:'',stTxt:S?S[2]:'',stTeam:S?S[3]:false};
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="./tokens/compies-tokens.css"><script src="./tokens/lucide-subset.js"></script></helmet>
<section aria-labelledby="{{ tid }}" lang="de" style="display:flex;flex-direction:column;gap:8px;min-width:0;font-family:var(--cp-font-sans);font-weight:500;color:var(--cp-ink)">
  <div style="display:flex;align-items:center;gap:8px;min-height:28px">
    <span aria-hidden="true" style="flex:none;display:grid;place-items:center;width:26px;height:26px;box-sizing:border-box;border-radius:50%;border:2px solid var(--cp-line);background:{{ discBg }};color:{{ discFg }}"><dc-import name="Icon" icon="{{ icon }}" size="{{ 14 }}" hint-size="14px,14px"></dc-import></span>
    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
      <span id="{{ tid }}" role="heading" aria-level="{{ lvl }}" style="font-size:13px;font-weight:800;line-height:1.25;text-wrap:balance">{{ title }}</span>
      <sc-if value="{{ hasSub }}"><span style="font-size:12px;font-weight:600;line-height:1.25;color:var(--cp-ink-2)">{{ sub }}</span></sc-if>
    </span>
    <sc-if value="{{ finished }}"><span style="flex:none;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;border:2px solid var(--cp-line);background:var(--cp-paper-2);font-size:12px;font-weight:700"><dc-import name="Icon" icon="lock" size="{{ 12 }}" hint-size="12px,12px"></dc-import>Event beendet</span></sc-if>
    <sc-if value="{{ edit }}"><button type="button" aria-label="{{ editLabel }}" style="flex:none;display:grid;place-items:center;width:44px;height:44px;margin:-8px -8px -8px 0;padding:0;border:0;background:transparent;color:var(--cp-ink);cursor:pointer"><span style="display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2px solid var(--cp-line);box-sizing:border-box;background:var(--cp-surface)"><dc-import name="Icon" icon="pencil" size="{{ 16 }}" hint-size="16px,16px"></dc-import></span></button></sc-if>
  </div>
  <div style="padding:{{ pad }};border-radius:12px;background:{{ pbg }};border:{{ pbd }}">
    <dc-import name="NotizText" doc="{{ doc }}" size="{{ size }}" hl="{{ hl }}" hint-size="100%,80px"></dc-import>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:360},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;game&quot;,&quot;event&quot;],&quot;default&quot;:&quot;game&quot;,&quot;tsType&quot;:&quot;'game'|'event'&quot;},&quot;doc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;edit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;finished&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;bare&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  uid='nb'+Math.random().toString(36).slice(2,8);
  renderVals(){
    const p=this.props, ev=p.kind==='event', fin=!!p.finished&&ev, bare=!!p.bare, lvl=+(p.level||3);
    const pad=bare?'0':(p.size==='sm'?'10px 12px':'12px 14px');
    return {tid:this.uid,lvl:String(lvl),hl:lvl+1,
      title:ev?'Notizen für dieses Event':'Notizen',sub:p.sub||'',hasSub:!!p.sub,
      icon:ev?'calendar':'sticky-note',
      discBg:fin?'var(--cp-paper-2)':ev?'var(--cp-primary)':'var(--cp-surface)',discFg:fin?'var(--cp-ink-2)':ev?'var(--cp-on-primary)':'var(--cp-ink)',
      finished:fin,edit:!!p.edit&&!fin,editLabel:ev?'Notizen für dieses Event bearbeiten':'Notizen bearbeiten',
      pad,pbg:bare?'transparent':ev?'var(--cp-surface)':'var(--cp-paper-2)',
      pbd:bare?'0':ev?(fin?'2px dashed var(--cp-line)':'2px solid var(--cp-line)'):'0',
      doc:p.doc||(ev?'event':'show'),size:p.size||'md'};
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isPage }}" hint-placeholder-val="{{ true }}">
  <footer style="position:relative;flex:none;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;padding:6px 16px">
    <sc-if value="{{ isBand }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position:absolute;inset:0;border-top:var(--cp-bw) solid var(--cp-line);background:var(--cp-surface)"></span></sc-if>
    <sc-if value="{{ isRule }}"><span aria-hidden="true" style="position:absolute;top:0;left:24px;right:24px;border-top:2px dashed var(--cp-line-soft)"></span></sc-if>
    <nav aria-label="Rechtliches und Version" style="position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:12px">
      <sc-if value="{{ curImp }}"><a href="/impressum" onClick="{{ nav }}" aria-current="page" style="display:inline-block;padding:12px 2px;border-radius:8px;font-size:14px;font-weight:800;line-height:20px;color:var(--cp-ink);text-decoration:none;white-space:nowrap;background-image:linear-gradient(transparent 55%,var(--cp-primary) 55%);background-repeat:no-repeat;background-size:100% 100%;background-origin:content-box;background-clip:content-box" style-hover="color:var(--cp-ink)">Impressum</a></sc-if>
      <sc-if value="{{ notImp }}" hint-placeholder-val="{{ true }}"><a href="/impressum" onClick="{{ nav }}" style="display:inline-block;padding:12px 2px;border-radius:8px;font-size:14px;font-weight:700;line-height:20px;color:var(--cp-ink);white-space:nowrap;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--cp-line-soft);text-underline-offset:5px;background-image:linear-gradient(transparent 55%,var(--cp-primary) 55%);background-repeat:no-repeat;background-size:0% 100%;background-origin:content-box;background-clip:content-box;transition:background-size var(--cp-dur-base) var(--cp-ease-out),text-decoration-color var(--cp-dur-fast) var(--cp-ease-out)" style-hover="color:var(--cp-ink);background-size:100% 100%;text-decoration-color:var(--cp-line)">Impressum</a></sc-if>
      <span style="display:inline-flex;align-items:center;gap:8px;white-space:nowrap"><span aria-hidden="true" style="flex:none;width:9px;height:9px;box-sizing:border-box;border:2px solid var(--cp-line);background:var(--cp-mint);transform:rotate(45deg)"></span>
      <sc-if value="{{ curDs }}"><a href="/datenschutz" onClick="{{ nav }}" aria-current="page" style="display:inline-block;padding:12px 2px;border-radius:8px;font-size:14px;font-weight:800;line-height:20px;color:var(--cp-ink);text-decoration:none;white-space:nowrap;background-image:linear-gradient(transparent 55%,var(--cp-primary) 55%);background-repeat:no-repeat;background-size:100% 100%;background-origin:content-box;background-clip:content-box" style-hover="color:var(--cp-ink)">Datenschutz</a></sc-if>
      <sc-if value="{{ notDs }}" hint-placeholder-val="{{ true }}"><a href="/datenschutz" onClick="{{ nav }}" style="display:inline-block;padding:12px 2px;border-radius:8px;font-size:14px;font-weight:700;line-height:20px;color:var(--cp-ink);white-space:nowrap;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--cp-line-soft);text-underline-offset:5px;background-image:linear-gradient(transparent 55%,var(--cp-primary) 55%);background-repeat:no-repeat;background-size:0% 100%;background-origin:content-box;background-clip:content-box;transition:background-size var(--cp-dur-base) var(--cp-ease-out),text-decoration-color var(--cp-dur-fast) var(--cp-ease-out)" style-hover="color:var(--cp-ink);background-size:100% 100%;text-decoration-color:var(--cp-line)">Datenschutz</a></sc-if></span>
      <span style="display:inline-flex;align-items:center;gap:8px;white-space:nowrap"><span aria-hidden="true" style="flex:none;width:9px;height:9px;box-sizing:border-box;border:2px solid var(--cp-line);border-radius:50%;background:var(--cp-primary)"></span>
      <sc-if value="{{ curNews }}"><a href="/neuigkeiten" onClick="{{ nav }}" aria-current="page" aria-label="{{ verAria }}" style="display:inline-block;padding:12px 2px;border-radius:8px;font-size:14px;font-weight:800;line-height:20px;color:var(--cp-ink);text-decoration:none;white-space:nowrap;background-image:linear-gradient(transparent 55%,var(--cp-primary) 55%);background-repeat:no-repeat;background-size:100% 100%;background-origin:content-box;background-clip:content-box" style-hover="color:var(--cp-ink)">Version <span style="font-family:var(--cp-font-num);font-weight:400;font-size:13px;letter-spacing:.02em">{{ version }}</span></a></sc-if>
      <sc-if value="{{ notNews }}" hint-placeholder-val="{{ true }}"><a href="/neuigkeiten" onClick="{{ nav }}" aria-label="{{ verAria }}" style="display:inline-block;padding:12px 2px;border-radius:8px;font-size:14px;font-weight:700;line-height:20px;color:var(--cp-ink);white-space:nowrap;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--cp-line-soft);text-underline-offset:5px;background-image:linear-gradient(transparent 55%,var(--cp-primary) 55%);background-repeat:no-repeat;background-size:0% 100%;background-origin:content-box;background-clip:content-box;transition:background-size var(--cp-dur-base) var(--cp-ease-out),text-decoration-color var(--cp-dur-fast) var(--cp-ease-out)" style-hover="color:var(--cp-ink);background-size:100% 100%;text-decoration-color:var(--cp-line)">Version <span style="font-family:var(--cp-font-num);font-weight:400;font-size:13px;letter-spacing:.02em">{{ version }}</span><sc-if value="{{ unseen }}"><span ref="{{ chipRef }}" aria-hidden="true" style="display:inline-flex;align-items:center;height:20px;box-sizing:border-box;margin-left:8px;padding:0 6px;border:2px solid var(--cp-line);border-radius:999px;background:var(--cp-primary);color:var(--cp-on-primary);font-family:var(--cp-font-sans);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1;vertical-align:1px;transform:rotate(-6deg)">Neu</span></sc-if></a></sc-if></span>
    </nav>
    <sc-if value="{{ dock }}"><span aria-hidden="true" style="flex:none;height:96px"></span></sc-if>
  </footer>
</sc-if>
<sc-if value="{{ isMenu }}">
  <div role="group" aria-label="Rechtliches und Version" style="display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;padding:0 6px">
    <a role="menuitem" href="/impressum" onClick="{{ nav }}" style="display:inline-block;padding:12px 2px;border-radius:8px;font-size:13px;font-weight:700;line-height:20px;color:var(--cp-ink);white-space:nowrap;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--cp-line-soft);text-underline-offset:5px;background-image:linear-gradient(transparent 55%,var(--cp-primary) 55%);background-repeat:no-repeat;background-size:0% 100%;background-origin:content-box;background-clip:content-box;transition:background-size var(--cp-dur-base) var(--cp-ease-out)" style-hover="color:var(--cp-ink);background-size:100% 100%;text-decoration-color:var(--cp-line)">Impressum</a>
    <span style="display:inline-flex;align-items:center;gap:8px;white-space:nowrap"><span aria-hidden="true" style="flex:none;width:9px;height:9px;box-sizing:border-box;border:2px solid var(--cp-line);background:var(--cp-mint);transform:rotate(45deg)"></span>
    <a role="menuitem" href="/datenschutz" onClick="{{ nav }}" style="display:inline-block;padding:12px 2px;border-radius:8px;font-size:13px;font-weight:700;line-height:20px;color:var(--cp-ink);white-space:nowrap;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--cp-line-soft);text-underline-offset:5px;background-image:linear-gradient(transparent 55%,var(--cp-primary) 55%);background-repeat:no-repeat;background-size:0% 100%;background-origin:content-box;background-clip:content-box;transition:background-size var(--cp-dur-base) var(--cp-ease-out)" style-hover="color:var(--cp-ink);background-size:100% 100%;text-decoration-color:var(--cp-line)">Datenschutz</a></span>
    <span style="display:inline-flex;align-items:center;gap:8px;white-space:nowrap"><span aria-hidden="true" style="flex:none;width:9px;height:9px;box-sizing:border-box;border:2px solid var(--cp-line);border-radius:50%;background:var(--cp-primary)"></span>
    <a role="menuitem" href="/neuigkeiten" onClick="{{ nav }}" aria-label="{{ verAria }}" style="display:inline-block;padding:12px 2px;border-radius:8px;font-size:13px;font-weight:700;line-height:20px;color:var(--cp-ink);white-space:nowrap;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--cp-line-soft);text-underline-offset:5px;background-image:linear-gradient(transparent 55%,var(--cp-primary) 55%);background-repeat:no-repeat;background-size:0% 100%;background-origin:content-box;background-clip:content-box;transition:background-size var(--cp-dur-base) var(--cp-ease-out)" style-hover="color:var(--cp-ink);background-size:100% 100%;text-decoration-color:var(--cp-line)">Version <span style="font-family:var(--cp-font-num);font-weight:400;font-size:13px;letter-spacing:.02em">{{ version }}</span><sc-if value="{{ unseen }}"><span ref="{{ chipRef }}" aria-hidden="true" style="display:inline-flex;align-items:center;height:20px;box-sizing:border-box;margin-left:8px;padding:0 6px;border:2px solid var(--cp-line);border-radius:999px;background:var(--cp-primary);color:var(--cp-on-primary);font-family:var(--cp-font-sans);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1;vertical-align:1px;transform:rotate(-6deg)">Neu</span></sc-if></a></span>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:120},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;page&quot;,&quot;menu&quot;],&quot;default&quot;:&quot;page&quot;,&quot;tsType&quot;:&quot;'page' | 'menu'&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;impressum&quot;,&quot;datenschutz&quot;,&quot;neuigkeiten&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;'' | 'impressum' | 'datenschutz' | 'neuigkeiten'&quot;},&quot;unseen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;version&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1.2.0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dock&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;look&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;band&quot;,&quot;rule&quot;],&quot;default&quot;:&quot;band&quot;,&quot;tsType&quot;:&quot;'band' | 'rule'&quot;},&quot;reduced&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;replay&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  chipRef = React.createRef();
  componentDidMount(){ if(this.props.animate!==false) this.enter(false); }
  componentDidUpdate(pp){ if(pp.replay!==this.props.replay && this.props.replay) this.enter(true); }
  enter(now){
    const el=this.chipRef.current; if(!el||!el.animate) return;
    const red=this.props.reduced||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)||!!el.closest('[data-motion="reduced"]');
    if(red) return;
    el.animate([{opacity:0,transform:'rotate(-6deg) scale(.5)'},{opacity:1,transform:'rotate(-6deg) scale(1)'}],
      {duration:220,delay:now?0:360,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'});
  }
  renderVals(){
    const p=this.props, v=p.variant||'page', cur=p.current||'', look=p.look||'band', unseen=!!p.unseen, ver=p.version||'1.2.0';
    return {
      isPage:v==='page', isMenu:v==='menu', isBand:look==='band', isRule:look==='rule', dock:!!p.dock,
      curImp:cur==='impressum', notImp:cur!=='impressum', curDs:cur==='datenschutz', notDs:cur!=='datenschutz',
      curNews:cur==='neuigkeiten', notNews:cur!=='neuigkeiten', unseen, version:ver,
      verAria:'Version '+ver+(unseen?', neu':''), chipRef:this.chipRef, nav:e=>e&&e.preventDefault()
    };
  }
}
</script>
</body>
</html>

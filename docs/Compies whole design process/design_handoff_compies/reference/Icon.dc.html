<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./tokens/lucide-subset.js"></script></helmet>
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" aria-hidden="true" focusable="false" style="display:block;flex:none;overflow:visible;fill:none;stroke-linecap:round;stroke-linejoin:round">
  <sc-if value="{{ hasOffset }}">
    <g transform="translate(1.8 1.8)" stroke="{{ offset }}" stroke-width="{{ sw }}">
      <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="0">
        <sc-if value="{{ n.path }}"><path d="{{ n.a.d }}"></path></sc-if>
        <sc-if value="{{ n.circle }}"><circle cx="{{ n.a.cx }}" cy="{{ n.a.cy }}" r="{{ n.a.r }}"></circle></sc-if>
        <sc-if value="{{ n.rect }}"><rect x="{{ n.a.x }}" y="{{ n.a.y }}" width="{{ n.a.width }}" height="{{ n.a.height }}" rx="{{ n.a.rx }}"></rect></sc-if>
        <sc-if value="{{ n.line }}"><line x1="{{ n.a.x1 }}" y1="{{ n.a.y1 }}" x2="{{ n.a.x2 }}" y2="{{ n.a.y2 }}"></line></sc-if>
        <sc-if value="{{ n.polyline }}"><polyline points="{{ n.a.points }}"></polyline></sc-if>
        <sc-if value="{{ n.polygon }}"><polygon points="{{ n.a.points }}"></polygon></sc-if>
        <sc-if value="{{ n.ellipse }}"><ellipse cx="{{ n.a.cx }}" cy="{{ n.a.cy }}" rx="{{ n.a.rx }}" ry="{{ n.a.ry }}"></ellipse></sc-if>
      </sc-for>
    </g>
  </sc-if>
  <g stroke="currentColor" stroke-width="{{ sw }}">
    <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="0">
      <sc-if value="{{ n.path }}"><path d="{{ n.a.d }}"></path></sc-if>
      <sc-if value="{{ n.circle }}"><circle cx="{{ n.a.cx }}" cy="{{ n.a.cy }}" r="{{ n.a.r }}"></circle></sc-if>
      <sc-if value="{{ n.rect }}"><rect x="{{ n.a.x }}" y="{{ n.a.y }}" width="{{ n.a.width }}" height="{{ n.a.height }}" rx="{{ n.a.rx }}"></rect></sc-if>
      <sc-if value="{{ n.line }}"><line x1="{{ n.a.x1 }}" y1="{{ n.a.y1 }}" x2="{{ n.a.x2 }}" y2="{{ n.a.y2 }}"></line></sc-if>
      <sc-if value="{{ n.polyline }}"><polyline points="{{ n.a.points }}"></polyline></sc-if>
      <sc-if value="{{ n.polygon }}"><polygon points="{{ n.a.points }}"></polygon></sc-if>
      <sc-if value="{{ n.ellipse }}"><ellipse cx="{{ n.a.cx }}" cy="{{ n.a.cy }}" rx="{{ n.a.rx }}" ry="{{ n.a.ry }}"></ellipse></sc-if>
    </sc-for>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:48,&quot;height&quot;:48},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;crown&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;sw&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:2.5,&quot;tsType&quot;:&quot;number&quot;},&quot;offset&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount(){ if(!window.CP_ICONS){ this._h=()=>this.forceUpdate(); window.addEventListener('cp-icons',this._h); } }
  componentWillUnmount(){ this._h && window.removeEventListener('cp-icons',this._h); }
  renderVals(){
    const I=window.CP_ICONS||{}; const raw=I[this.props.icon]||[];
    const nodes=raw.map(([tag,a])=>({a,[tag]:true}));
    const size=this.props.size ?? 20;
    const sw=this.props.sw ?? (size<=16?2:2.5);
    const offset=this.props.offset||'';
    return { nodes, size, sw, offset, hasOffset:!!offset };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Bungee&family=Caveat+Brush&family=Fredoka:wght@400..700&family=Hanken+Grotesk:wght@400..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@400..800&family=Patrick+Hand&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"><script src="./themes.js"></script></helmet>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<div style="width:380px;box-sizing:border-box;padding:24px;background-color:{{ t.c.bg }};background-image:{{ t.c.bgImg }};background-size:{{ t.c.bgSize }};color:{{ t.c.ink }};font-family:{{ t.f.b }};display:flex;flex-direction:column;gap:18px">
  <div style="font-family:{{ t.f.lab }};text-transform:{{ t.f.labc }};letter-spacing:{{ t.f.labt }};font-size:11px;color:{{ t.c.ink2 }}">Compibert · {{ t.de }}</div>
  <div style="position:relative;display:flex;justify-content:center;padding:8px 0 4px">
    <div style="position:absolute;left:50%;bottom:6px;width:210px;height:18px;margin-left:-105px;border-radius:50%;background:{{ t.c.ink }};opacity:.12"></div>
    <dc-import name="Compibert" dir="{{ t.id }}" variant="full" size="{{ 300 }}" hint-size="300px,253px"></dc-import>
  </div>
  <div style="display:flex;align-items:flex-end;gap:16px;padding-top:4px;border-top:{{ t.s.div }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:14px">
      <div style="position:relative;width:72px;height:72px;border-radius:{{ t.s.rAv }};background:{{ t.c.panel2 }};border:{{ t.s.avBorder }};box-shadow:{{ t.s.btnShadow }};overflow:hidden;display:grid;place-items:center"><dc-import name="Compibert" dir="{{ t.id }}" variant="head" size="{{ 64 }}" hint-size="64px,64px"></dc-import></div>
      <span style="font-size:11px;color:{{ t.c.ink2 }}">72 px</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="position:relative;width:44px;height:44px;border-radius:{{ t.s.rAv }};background:{{ t.c.panel2 }};border:{{ t.s.avBorder }};overflow:hidden;display:grid;place-items:center"><dc-import name="Compibert" dir="{{ t.id }}" variant="head" size="{{ 40 }}" hint-size="40px,40px"></dc-import></div>
      <span style="font-size:11px;color:{{ t.c.ink2 }}">44 px</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="position:relative;width:28px;height:28px;border-radius:{{ t.s.rAv }};background:{{ t.c.panel2 }};overflow:hidden;display:grid;place-items:center"><dc-import name="Compibert" dir="{{ t.id }}" variant="head" size="{{ 26 }}" hint-size="26px,26px"></dc-import></div>
      <span style="font-size:11px;color:{{ t.c.ink2 }}">28 px</span>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;background:{{ t.c.accent }};color:{{ t.c.accentInk }};border-radius:{{ t.s.rChip }};border:{{ t.s.btnBorder }};box-shadow:{{ t.s.btnShadow }};font-family:{{ t.f.h }};font-weight:{{ t.f.hw }};font-size:14px;text-transform:uppercase"><dc-import name="Compibert" dir="{{ t.id }}" variant="head" size="{{ 26 }}" hint-size="26px,26px"></dc-import>Roaar!</div>
      <span style="font-size:11px;color:{{ t.c.ink2 }}">Emote</span>
    </div>
  </div>
  <div style="font-size:13px;line-height:1.45;color:{{ t.c.ink2 }};text-wrap:pretty">{{ t.mascot.note }}</div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:560},&quot;dir&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;swiss&quot;,&quot;memphis&quot;,&quot;hand&quot;,&quot;pixel&quot;,&quot;picnic&quot;,&quot;kofi&quot;,&quot;swissmemphis&quot;,&quot;swisspixel&quot;,&quot;kofihand&quot;,&quot;picnicpixel&quot;,&quot;memphispixel&quot;,&quot;swisshand&quot;],&quot;default&quot;:&quot;swiss&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount(){ if(!window.COMPIES_THEMES){ this._h=()=>{ if(!this._done){ this._done=true; this.forceUpdate(); } }; window.addEventListener('compies-themes',this._h);} }
  componentWillUnmount(){ this._h && window.removeEventListener('compies-themes',this._h); }
  renderVals(){ const T=window.COMPIES_THEMES; if(!T) return {ready:false}; return {ready:true,t:T[this.props.dir]||T.swiss}; }
}
</script>
</body>
</html>
